[project]
name = "lifu-backend"
version = "0.1.0"
description = "LifU backend — gamified productivity app"
requires-python = ">=3.10"
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15,<4.0",
    "drf-spectacular>=0.27,<1.0",
    "firebase-admin>=6.5,<7.0",
    "requests>=2.31,<3.0",
    "django-cors-headers>=4.4,<5.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.8,<5.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools]
packages = ["lifu", "api", "core", "repos", "services", "aiclients", "providers"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "lifu.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests", "api", "core", "repos", "services", "aiclients", "providers"]
markers = [
    "groq: live calibration test against the real Groq API (skipped unless GROQ_API_KEY is set)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["lifu", "api", "core", "repos", "services", "aiclients", "providers"]

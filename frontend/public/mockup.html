<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifU — mockup</title>
<style>
/* ------------------------------------------------------------------
   Static design mockup. No API, no state — hardcoded data throughout.
   Exists to agree on the look before any of it gets wired up.
   ------------------------------------------------------------------ */

:root {
  --bg:        #0b0710;
  --panel:     rgba(255,255,255,.045);
  --line:      rgba(255,255,255,.10);
  --text:      #f2ecf7;
  --muted:     #9a8caa;
  --gold:      #f5c14a;
  --violet:    #8e6ff0;
  --radius:    18px;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    radial-gradient(70vw 60vh at 15% 0%,   rgba(150, 90, 240, .16), transparent 65%),
    radial-gradient(60vw 55vh at 85% 100%, rgba(245, 160, 60, .12), transparent 65%);
  pointer-events: none; z-index: 0;
}

h1, h2, .greeting { font-family: Georgia, "Times New Roman", serif; font-weight: 400; letter-spacing: .01em; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

/* ---------- the snapping deck ---------- */

.deck {
  position: relative; z-index: 1;
  height: 100vh; overflow-y: scroll;
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth; scrollbar-width: none;
}
.deck::-webkit-scrollbar { display: none; }

.layout {
  height: 100vh; scroll-snap-align: start; scroll-snap-stop: always;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 78px 32px 40px; gap: 20px;
}

.rail {
  position: fixed; right: 26px; top: 50%; transform: translateY(-50%);
  z-index: 40; display: flex; flex-direction: column; gap: 14px;
}
.rail button { width: 10px; height: 10px; padding: 0; border-radius: 50%; background: rgba(255,255,255,.22); transition: all .25s; }
.rail button.on { background: var(--gold); box-shadow: 0 0 14px var(--gold); transform: scale(1.35); }

.topbar {
  position: fixed; top: 22px; left: 30px; right: 30px; z-index: 40;
  display: flex; align-items: center; justify-content: space-between; pointer-events: none;
}
.brand { font-family: Georgia, serif; font-size: 19px; letter-spacing: .16em; color: var(--muted); }
.wallet {
  pointer-events: auto; display: flex; align-items: center; gap: 9px;
  background: rgba(0,0,0,.4); border: 1px solid var(--line);
  padding: 8px 16px; border-radius: 999px; backdrop-filter: blur(12px);
}
.wallet b { font-size: 17px; color: var(--gold); }
.topbar a {
  pointer-events: auto; color: var(--muted); text-decoration: none; font-size: 13px;
  letter-spacing: .1em; text-transform: uppercase;
  border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px;
}
.topbar a:hover { color: var(--text); border-color: rgba(245,193,74,.5); }

/* ========================= LAYOUT 1 ========================= */

.ledger { width: 100%; max-width: 780px; }
.greeting {
  font-size: clamp(28px, 4.4vw, 44px); line-height: 1.15; margin: 0 0 20px;
  background: linear-gradient(180deg, #fff 25%, #c8b0e8);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.composer { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; transition: border-color .25s, box-shadow .25s; }
.composer:focus-within { border-color: rgba(245,193,74,.5); box-shadow: 0 0 0 4px rgba(245,193,74,.08), 0 20px 50px -20px rgba(245,193,74,.35); }
.composer textarea {
  width: 100%; min-height: 120px; resize: none; background: none; border: 0; outline: none;
  color: var(--text); font: inherit; font-size: 17px; line-height: 1.6; padding: 18px 20px;
}
.composer textarea::placeholder { color: #6d6079; }
.composer-foot { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px 10px 20px; }
.hint { font-size: 12.5px; color: #6d6079; }

.btn-primary {
  background: linear-gradient(180deg, #f7cf6a, #d99a25); color: #2b1c02;
  font-weight: 700; font-size: 14.5px; letter-spacing: .06em; text-transform: uppercase;
  padding: 12px 26px; border-radius: 12px;
  box-shadow: 0 10px 26px -10px rgba(245,193,74,.75);
  transition: transform .12s, box-shadow .25s, filter .2s;
}
.btn-primary:hover { filter: brightness(1.08); box-shadow: 0 14px 34px -10px rgba(245,193,74,.95); }
.btn-primary:active { transform: translateY(2px); }

.recent { margin-top: 26px; }
.recent-head { font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase; color: #6d6079; margin-bottom: 8px; padding-left: 4px; }
.task { display: flex; align-items: center; gap: 18px; padding: 12px 18px; border-radius: 13px; border: 1px solid transparent; transition: background .2s, border-color .2s; }
.task:hover { background: rgba(255,255,255,.035); border-color: var(--line); }
.task-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #d9d0e4; font-size: 15px; }
.task-meta { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.drops { display: flex; gap: 9px; }
.drop { display: flex; align-items: center; gap: 3px; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
.drop img { width: 21px; height: 21px; filter: drop-shadow(0 0 5px rgba(255,255,255,.16)); }
.task-when { font-size: 12.5px; color: #5f5369; min-width: 84px; text-align: right; }
.more { display: block; width: 100%; text-align: center; padding: 11px; margin-top: 4px; font-size: 13px; letter-spacing: .18em; color: #6d6079; }
.more:hover { color: var(--gold); }

.scroll-cue { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: #4e4459; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translate(-50%,0); } 50% { transform: translate(-50%,7px); } }

/* ========================= LAYOUT 2 ========================= */

.vault { width: 100%; max-width: 1080px; display: flex; flex-direction: column; gap: 18px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); backdrop-filter: blur(14px); }

.hoard { padding: 22px 26px; max-height: 54vh; overflow-y: auto; }
.hoard::-webkit-scrollbar { width: 7px; }
.hoard::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 4px; }

.group-label { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #6d6079; margin: 16px 0 12px; }
.group-label:first-child { margin-top: 0; }
.grid { display: flex; flex-wrap: wrap; gap: 8px; }

.item {
  position: relative; width: 82px; padding: 9px 4px 7px;
  border-radius: 13px; border: 1px solid transparent;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: grab; user-select: none;
  transition: background .18s, border-color .18s, transform .18s;
}
.item:hover { background: rgba(255,255,255,.06); border-color: var(--line); transform: translateY(-3px); }
.item img { width: 50px; height: 50px; filter: drop-shadow(0 3px 10px rgba(0,0,0,.6)); }
.item .n { font-size: 13px; font-variant-numeric: tabular-nums; color: #cfc4dc; }
.item.locked img { opacity: .78; }
.item .lock { position: absolute; top: 5px; right: 8px; font-size: 11px; color: var(--gold); text-shadow: 0 0 8px rgba(245,193,74,.8); }
.item .ready { position: absolute; top: 5px; right: 8px; font-size: 11px; color: #7fc99a; text-shadow: 0 0 8px rgba(127,201,154,.8); }
.item::after {
  content: attr(data-name);
  position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  background: #221830; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  padding: 5px 11px; font-size: 12px; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .16s; z-index: 5;
}
.item:hover::after { opacity: 1; }

/* merge bench */
.bench { display: flex; align-items: center; gap: 14px; padding: 18px 22px; position: relative; }
.slots {
  flex: 1; display: flex; align-items: center; gap: 10px;
  min-height: 84px; padding: 8px 14px;
  border: 1.5px dashed rgba(255,255,255,.16); border-radius: 14px;
  transition: border-color .2s, background .2s;
}
.slots.hot { border-color: var(--gold); background: rgba(245,193,74,.07); }
.slots .placeholder { color: #5f5369; font-size: 13.5px; }
.qty { width: 74px; padding: 12px; text-align: center; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 11px; color: var(--text); font: inherit; font-size: 16px; outline: none; }
.qty:focus { border-color: rgba(245,193,74,.6); }
.btn-merge {
  background: linear-gradient(180deg, #8e6ff0, #6543c4); color: #fff;
  font-weight: 600; font-size: 14px; letter-spacing: .04em;
  padding: 13px 22px; border-radius: 12px; min-width: 200px;
  box-shadow: 0 10px 26px -12px rgba(142,111,240,.9);
  transition: filter .2s, transform .12s;
}
.btn-merge:hover:not(:disabled) { filter: brightness(1.12); }
.btn-merge:active:not(:disabled) { transform: translateY(2px); }
.btn-merge:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }

/* the little (i) and its recipe card */
.info-btn {
  width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%;
  border: 1px solid var(--line); color: var(--muted);
  font-family: Georgia, serif; font-size: 14px; font-style: italic;
  display: grid; place-items: center; transition: all .2s;
}
.info-btn:hover, .info-btn.on { color: var(--gold); border-color: var(--gold); background: rgba(245,193,74,.1); }

.info-pop {
  position: absolute; bottom: calc(100% + 12px); right: 0; width: 480px;
  background: #17101f; border: 1px solid var(--line); border-radius: 16px;
  padding: 20px 22px; box-shadow: 0 26px 60px -20px rgba(0,0,0,.9);
  display: none; z-index: 20;
}
.info-pop.show { display: block; }
.info-pop h3 { font-family: Georgia, serif; font-weight: 400; font-size: 15px; margin: 0 0 4px; color: var(--gold); }
.info-pop p { margin: 0 0 14px; font-size: 13px; line-height: 1.55; color: var(--muted); }
.recipe-row { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.recipe-row img { width: 22px; height: 22px; }
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; margin-top: 2px; }
.ladder { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.ladder b { color: #cfc4dc; font-weight: 500; }

/* ========================= LAYOUT 3 ========================= */

.treasury { width: 100%; max-width: 1180px; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }

/* Smaller now — these are just the selector; the contents are the event. */
.chests { display: flex; gap: 12px; flex-shrink: 0; }
.chest {
  width: 138px; padding: 11px 10px 9px;
  border-radius: 14px; border: 1px solid var(--line);
  background: var(--panel); backdrop-filter: blur(14px);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  transition: transform .22s, border-color .22s, box-shadow .22s;
}
.chest:hover { transform: translateY(-4px); border-color: rgba(245,193,74,.4); }
.chest.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 20px 40px -20px rgba(245,193,74,.7); transform: translateY(-4px); }
.chest img { width: 52px; height: 52px; filter: drop-shadow(0 5px 12px rgba(0,0,0,.7)); }
.chest .cname { font-family: Georgia, serif; font-size: 13px; }
.chest .cprice { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--gold); font-variant-numeric: tabular-nums; }
.chest .ccount { font-size: 10.5px; color: #6d6079; }

/* Contents dominate the screen. */
.contents {
  flex: 1; width: 100%; min-height: 0;
  display: flex; align-items: center; justify-content: center;
  flex-wrap: wrap; gap: 6px 20px; padding: 6px 0;
}
.contents .empty { color: #5f5369; font-size: 14px; }

.floater {
  width: clamp(130px, 17vw, 215px);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  animation: float 3.4s ease-in-out infinite;
  transition: opacity .6s, filter .6s, transform .6s;
}
.floater img {
  width: 100%; height: auto; max-height: 46vh; object-fit: contain;
  filter: drop-shadow(0 10px 26px rgba(0,0,0,.7));
}
.floater .fname { font-size: 12.5px; color: var(--muted); text-align: center; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-13px); } }

/* Long elimination: everything shivers, then they go out one at a time. */
.floater.shiver { animation: shiver .5s ease-in-out infinite; }
@keyframes shiver {
  0%,100% { transform: translateY(0) rotate(-1.5deg) scale(1); }
  50%     { transform: translateY(-6px) rotate(1.5deg) scale(1.04); }
}
.floater.out { opacity: .13; filter: grayscale(1) brightness(.45); transform: scale(.78); animation: none; }
.floater.won {
  animation: wonPulse 1.6s ease-in-out infinite;
  filter: drop-shadow(0 0 40px var(--gold)) drop-shadow(0 0 90px rgba(245,193,74,.5));
}
@keyframes wonPulse { 0%,100% { transform: scale(1.12); } 50% { transform: scale(1.2); } }

.buy-row { flex-shrink: 0; display: flex; align-items: center; gap: 14px; min-height: 46px; }
.rolling { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }

/* ========================= overlays ========================= */

.veil {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(6,3,10,.9); backdrop-filter: blur(9px);
  display: none; align-items: center; justify-content: center; flex-direction: column; gap: 24px;
}
.veil.show { display: flex; }

.prize { display: flex; flex-direction: column; align-items: center; gap: 12px; animation: burst .55s cubic-bezier(.2,1.5,.4,1); z-index: 2; }
@keyframes burst {
  0%   { transform: scale(.25) rotate(-16deg); opacity: 0; }
  70%  { transform: scale(1.12) rotate(3deg); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}
.prize img { width: 190px; height: 190px; filter: drop-shadow(0 0 44px rgba(245,193,74,.65)) drop-shadow(0 0 90px rgba(150,90,240,.4)); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.prize .amount { font-family: Georgia, serif; font-size: 46px; color: var(--gold); }
.prize .label { font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

.rays {
  position: absolute; width: 620px; height: 620px; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0 8%, rgba(245,193,74,.16) 8% 10%, transparent 10% 20%,
              rgba(245,193,74,.16) 20% 22%, transparent 22% 33%, rgba(245,193,74,.16) 33% 35%,
              transparent 35% 47%, rgba(245,193,74,.16) 47% 49%, transparent 49% 60%,
              rgba(245,193,74,.16) 60% 62%, transparent 62% 74%, rgba(245,193,74,.16) 74% 76%, transparent 76%);
  animation: turn 15s linear infinite; pointer-events: none;
}
@keyframes turn { to { transform: rotate(360deg); } }

.veil-actions { display: flex; gap: 12px; z-index: 2; }
.btn-ghost { border: 1px solid var(--line); color: var(--muted); padding: 12px 24px; border-radius: 12px; font-size: 14px; }
.btn-ghost:hover { color: var(--text); border-color: var(--muted); }
.queue-dots { display: flex; gap: 6px; z-index: 2; }
.queue-dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.2); }
.queue-dots i.on { background: var(--gold); }

/* double-click item detail */
.detail-card {
  position: relative; z-index: 2; width: 430px;
  background: #17101f; border: 1px solid var(--line); border-radius: 20px;
  padding: 30px; text-align: center;
  box-shadow: 0 30px 70px -24px rgba(0,0,0,.95);
  animation: burst .45s cubic-bezier(.2,1.4,.4,1);
}
.detail-card > img { width: 150px; height: 150px; filter: drop-shadow(0 10px 30px rgba(0,0,0,.7)); }
.detail-card h2 { font-size: 25px; margin: 8px 0 2px; }
.detail-card .sub { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #6d6079; }
.detail-card .desc { font-size: 14.5px; line-height: 1.65; color: var(--muted); margin: 16px 0 20px; }
.keyline {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 13px; border-radius: 13px; font-size: 13.5px; margin-bottom: 18px;
}
.keyline img { width: 32px; height: 32px; }
.keyline.have { background: rgba(127,201,154,.1); border: 1px solid rgba(127,201,154,.3); color: #9fdcb4; }
.keyline.need { background: rgba(224,87,79,.08); border: 1px solid rgba(224,87,79,.25); color: #e2948e; }
.detail-actions { display: flex; gap: 10px; justify-content: center; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">LIFU</div>
  <div style="display:flex;gap:12px;align-items:center">
    <div class="wallet"><img src="icons/collectables/sun_fragment.png" width="20" height="20" alt=""><b id="coins">1,284</b></div>
    <a href="mockup-admin.html">Admin</a>
  </div>
</div>

<div class="rail">
  <button class="on" data-go="0"></button><button data-go="1"></button><button data-go="2"></button>
</div>

<main class="deck" id="deck">

  <!-- ============ 1 ============ -->
  <section class="layout">
    <div class="ledger">
      <h1 class="greeting" id="greeting">Another great accomplishment:</h1>
      <div class="composer">
        <textarea id="taskInput" placeholder="What did you get done?"></textarea>
        <div class="composer-foot">
          <span class="hint">It gets read, weighed, and paid in elements.</span>
          <button class="btn-primary" id="submitTask">Claim</button>
        </div>
      </div>
      <div class="recent">
        <div class="recent-head">Recently done</div>
        <div id="taskList"></div>
        <button class="more" id="moreBtn">· · ·  more  · · ·</button>
      </div>
    </div>
    <div class="scroll-cue">scroll</div>
  </section>

  <!-- ============ 2 ============ -->
  <section class="layout">
    <div class="vault">
      <div class="panel hoard" id="hoard"></div>
      <div class="panel bench">
        <div class="slots" id="slots"><span class="placeholder">Drag items here — double-click any item to inspect it</span></div>
        <input class="qty" id="qty" type="number" value="1" min="1">
        <button class="btn-merge" id="mergeBtn" disabled>Merge</button>
        <button class="info-btn" id="infoBtn" title="What merges into what">i</button>
        <div class="info-pop" id="infoPop"></div>
      </div>
    </div>
  </section>

  <!-- ============ 3 ============ -->
  <section class="layout">
    <div class="treasury">
      <div class="chests" id="chests"></div>
      <div class="contents" id="contents"><span class="empty">Pick a treasure to see what's inside</span></div>
      <div class="buy-row">
        <button class="btn-primary" id="buyBtn" style="display:none">Buy — <span id="buyPrice"></span></button>
        <span class="rolling" id="rolling" style="display:none">rolling&hellip;</span>
      </div>
    </div>
  </section>

</main>

<div class="veil" id="veil">
  <div class="rays"></div>
  <div id="veilBody"></div>
  <div class="queue-dots" id="queueDots"></div>
  <div class="veil-actions">
    <button class="btn-ghost" id="skipBtn">Skip all</button>
    <button class="btn-primary" id="acceptBtn">Accept</button>
  </div>
</div>

<div class="veil" id="detailVeil"><div id="detailBody"></div></div>

<script>
/* ------------------------------------------------------------------
   All data below is fake and inline. No API calls, no state management.
   ------------------------------------------------------------------ */

const ico  = (n) => `icons/collectables/${n}.png`;
const rico = (n) => `icons/receptacles/${n}.png`;
const pretty = (s) => s.split('_').map(w => w[0].toUpperCase() + w.slice(1)).join(' ');

const BASE = ['space','air','fire','water','earth'];
const RARITIES = ['fragment','shard','crystal','essence','soul','core'];
const RECEPTACLE_TIERS = ['pouch','sack','chest','safe','vault','sanctum'];

/* virtue -> its key element, and receptacle tier -> collectable rarity.
   Mirrors VIRTUE_ELEMENT / key_rarity_for in backend/core/mappings.py. */
const VIRTUE_ELEMENT = {
  nurturing:'growth', determination:'forge', adaptability:'dust', presence:'mountain',
  transformation:'steam', reflection:'mist', serenity:'ocean', inspiration:'lightning',
  vitality:'sun', freedom:'wind',
};
const TIER_RARITY = { pouch:'fragment', sack:'shard', chest:'crystal', safe:'essence', vault:'soul', sanctum:'core' };

const COMBINE_PAIRS = [
  ['earth','water','growth'], ['earth','fire','forge'], ['earth','air','dust'],
  ['earth','space','mountain'], ['water','fire','steam'], ['water','air','mist'],
  ['water','space','ocean'], ['fire','air','lightning'], ['fire','space','sun'],
  ['air','space','wind'],
];

const ELEMENT_FLAVOUR = {
  space:'awareness made solid', air:'curiosity made solid', fire:'willpower made solid',
  water:'compassion made solid', earth:'discipline made solid', harmony:'all five held in balance',
  growth:'earth and water, still growing', forge:'earth and fire, hammered together',
  dust:'earth and air, never settling', mountain:'earth and space, immovable',
  steam:'water and fire, mid-change', mist:'water and air, half-concealed',
  ocean:'water and space, and the dark below', lightning:'fire and air, caught mid-strike',
  sun:'fire and space, giving light away', wind:'air and space, unbound',
};

/* ---------- layout 1 ---------- */

const GREETINGS = [
  "Another great accomplishment:", "What did you conquer?", "Go on — brag a little.",
  "Something moved forward today.", "Tell me what you finished.",
  "The day owes you nothing. What did you take?",
];
document.getElementById('greeting').textContent = GREETINGS[Math.floor(Math.random()*GREETINGS.length)];

const TASKS = [
  { t:"Ran 10km along the river before work",         d:[[13,'fire_fragment'],[8,'earth_fragment']],   w:"a minute ago" },
  { t:"Finished the third chapter of the thesis",     d:[[22,'space_fragment'],[15,'earth_fragment']], w:"3 hours ago" },
  { t:"Called mum and actually listened",             d:[[18,'water_fragment']],                       w:"yesterday" },
  { t:"Read 40 pages of the Dostoevsky",              d:[[12,'air_fragment'],[9,'space_fragment']],    w:"2 days ago" },
  { t:"Fixed the leaking tap instead of ignoring it", d:[[7,'earth_fragment'],[4,'fire_fragment']],    w:"3 days ago" },
  { t:"Sat still for twenty minutes",                 d:[[11,'space_fragment']],                       w:"4 days ago" },
  { t:"Cooked properly rather than ordering in",      d:[[9,'water_fragment'],[6,'earth_fragment']],   w:"5 days ago" },
];
let shown = 4;
function renderTasks() {
  document.getElementById('taskList').innerHTML = TASKS.slice(0, shown).map(x => `
    <div class="task">
      <div class="task-text">${x.t}</div>
      <div class="task-meta">
        <div class="drops">${x.d.map(([n,e]) => `<span class="drop"><img src="${ico(e)}" alt="">${n}</span>`).join('')}</div>
        <div class="task-when">${x.w}</div>
      </div>
    </div>`).join('');
  document.getElementById('moreBtn').style.display = shown >= TASKS.length ? 'none' : 'block';
}
document.getElementById('moreBtn').onclick = () => { shown = TASKS.length; renderTasks(); };
renderTasks();

/* ---------- layout 2 ---------- */

const COLLECTABLES = {
  fire_fragment:34, water_fragment:21, earth_fragment:47, air_fragment:12, space_fragment:58,
  harmony_fragment:9, fire_shard:6, earth_shard:4, space_shard:11,
  ocean_essence:2, lightning_crystal:3, steam_crystal:1, sun_soul:1, growth_core:1,
};
const OWNED_RECEPTACLES = [
  'nurturing_pouch','determination_sack','inspiration_chest',
  'serenity_safe','vitality_vault','freedom_sanctum',
];

/* The key a receptacle needs, and whether it's actually in the hoard. */
function keyFor(receptacle) {
  const [virtue, tier] = receptacle.split('_');
  return `${VIRTUE_ELEMENT[virtue]}_${TIER_RARITY[tier]}`;
}
const hasKey = (r) => (COLLECTABLES[keyFor(r)] || 0) > 0;

document.getElementById('hoard').innerHTML = `
  <div class="group-label">Collectables</div>
  <div class="grid">
    ${Object.entries(COLLECTABLES).map(([n,c]) => `
      <div class="item" draggable="true" data-name="${pretty(n)}" data-key="${n}" data-kind="collectable">
        <img src="${ico(n)}" alt=""><span class="n">${c}</span>
      </div>`).join('')}
  </div>
  <div class="group-label">Receptacles — sealed</div>
  <div class="grid">
    ${OWNED_RECEPTACLES.map(n => `
      <div class="item ${hasKey(n) ? '' : 'locked'}" draggable="true" data-name="${pretty(n)}" data-key="${n}" data-kind="receptacle">
        <span class="${hasKey(n) ? 'ready' : 'lock'}">${hasKey(n) ? '&#9679;' : '&#128274;'}</span>
        <img src="${rico(n)}" alt="">
      </div>`).join('')}
  </div>`;

const slots = document.getElementById('slots');
const mergeBtn = document.getElementById('mergeBtn');
let bench = [];

const isReceptacle = (k) => RECEPTACLE_TIERS.some(t => k.endsWith('_' + t));
const artFor = (k) => isReceptacle(k) ? rico(k) : ico(k);

function renderBench() {
  if (!bench.length) {
    slots.innerHTML = '<span class="placeholder">Drag items here — double-click any item to inspect it</span>';
    mergeBtn.disabled = true; mergeBtn.textContent = 'Merge';
    return;
  }
  slots.innerHTML = bench.map(k => `<div class="item" data-name="${pretty(k)}"><img src="${artFor(k)}" alt=""></div>`).join('');
  mergeBtn.disabled = false;
  // One bench, three operations: the button names whichever the contents imply.
  const els = bench.map(k => k.split('_')[0]);
  if (bench.length === 1 && isReceptacle(bench[0])) {
    mergeBtn.textContent = hasKey(bench[0]) ? 'Open it' : 'No key';
    mergeBtn.disabled = !hasKey(bench[0]);
  } else if (new Set(els).size === 5 && els.every(e => BASE.includes(e))) {
    mergeBtn.textContent = 'Harmony merge';
  } else if (bench.length === 3 && els.includes('harmony')) {
    const two = els.filter(e => e !== 'harmony');
    const hit = COMBINE_PAIRS.find(([a,b]) => two.includes(a) && two.includes(b));
    mergeBtn.textContent = hit ? `Combine → ${pretty(hit[2])}` : 'Not a valid pair';
    mergeBtn.disabled = !hit;
  } else {
    const [el, ra] = bench[0].split('_');
    const next = RARITIES[RARITIES.indexOf(ra) + 1];
    mergeBtn.textContent = next ? `Merge up → ${pretty(el)} ${pretty(next)}` : 'Already a Core';
    mergeBtn.disabled = !next;
  }
}

document.querySelectorAll('#hoard .item').forEach(el => {
  el.addEventListener('dragstart', e => e.dataTransfer.setData('k', el.dataset.key));
  el.addEventListener('click', () => { if (bench.length < 5) { bench.push(el.dataset.key); renderBench(); } });
  el.addEventListener('dblclick', () => { bench = bench.filter(k => k !== el.dataset.key); renderBench(); showDetail(el.dataset.key, el.dataset.kind); });
});
slots.addEventListener('dragover', e => { e.preventDefault(); slots.classList.add('hot'); });
slots.addEventListener('dragleave', () => slots.classList.remove('hot'));
slots.addEventListener('drop', e => {
  e.preventDefault(); slots.classList.remove('hot');
  const k = e.dataTransfer.getData('k');
  if (k && bench.length < 5) { bench.push(k); renderBench(); }
});
slots.addEventListener('click', () => { bench = []; renderBench(); });
mergeBtn.onclick = () => {
  showPrize([{ img: ico('fire_shard'), title: 'Fire Shard', sub: 'merged' }]);
  bench = []; renderBench();
};

/* the (i) recipe card */
const infoPop = document.getElementById('infoPop');
infoPop.innerHTML = `
  <h3>Merge up</h3>
  <p>Three of the same element and rarity become one of the next rarity.</p>
  <div class="ladder">${RARITIES.map(r => `<b>${pretty(r)}</b>`).join('<span>&rarr;</span>')}</div>
  <h3 style="margin-top:16px">Harmony merge</h3>
  <p>One of each of the five base elements, all the same rarity, becomes five Harmony — then keeps rolling for extras until it fails.</p>
  <div class="recipe-row">
    ${BASE.map(e => `<img src="${ico(e + '_fragment')}" alt="" title="${pretty(e)}">`).join('')}
    <span>&rarr;</span><img src="${ico('harmony_fragment')}" alt=""><span>&times;5+</span>
  </div>
  <h3 style="margin-top:16px">Combine</h3>
  <p>Two base elements plus one Harmony, all the same rarity, become one combined element — the keys receptacles open with.</p>
  <div class="pairs">
    ${COMBINE_PAIRS.map(([a,b,r]) => `
      <div class="recipe-row">
        <img src="${ico(a+'_fragment')}" alt=""><span>+</span><img src="${ico(b+'_fragment')}" alt="">
        <span>&rarr;</span><img src="${ico(r+'_fragment')}" alt=""> ${pretty(r)}
      </div>`).join('')}
  </div>`;

document.getElementById('infoBtn').onclick = (e) => {
  e.stopPropagation();
  infoPop.classList.toggle('show');
  document.getElementById('infoBtn').classList.toggle('on');
};
document.addEventListener('click', (e) => {
  if (!infoPop.contains(e.target)) { infoPop.classList.remove('show'); document.getElementById('infoBtn').classList.remove('on'); }
});

/* ---------- double-click detail ---------- */

const detailVeil = document.getElementById('detailVeil');

function showDetail(key, kind) {
  const body = document.getElementById('detailBody');
  if (kind === 'receptacle') {
    const [virtue, tier] = key.split('_');
    const k = keyFor(key), have = hasKey(key);
    body.innerHTML = `
      <div class="detail-card">
        <img src="${rico(key)}" alt="">
        <h2>${pretty(tier)} of ${pretty(virtue)}</h2>
        <div class="sub">sealed &middot; ${tier}</div>
        <div class="desc">Something you wanted, sealed away until you earn the way in. What's inside stays hidden until it opens.</div>
        <div class="keyline ${have ? 'have' : 'need'}">
          <img src="${ico(k)}" alt="">
          ${have
            ? `<span>Ready — one ${pretty(k)} will open this</span>`
            : `<span>Needs one ${pretty(k)} — you don't have one yet</span>`}
        </div>
        <div class="detail-actions">
          ${have ? '<button class="btn-primary" id="openIt">Open it</button>' : ''}
          <button class="btn-ghost" onclick="closeDetail()">Close</button>
        </div>
      </div>`;
    const ob = document.getElementById('openIt');
    if (ob) ob.onclick = () => { closeDetail(); showPrize([{ img: rico(key), title: pretty(key), sub: 'opened' }]); };
  } else {
    const [el, ra] = key.split('_');
    const nxt = RARITIES[RARITIES.indexOf(ra) + 1];
    body.innerHTML = `
      <div class="detail-card">
        <img src="${ico(key)}" alt="">
        <h2>${pretty(key)}</h2>
        <div class="sub">${el} &middot; ${ra} &middot; ${COLLECTABLES[key]} held</div>
        <div class="desc">${pretty(el)} — ${ELEMENT_FLAVOUR[el] || ''}.<br>
          ${nxt ? `Three of these merge into one ${pretty(el)} ${pretty(nxt)}.` : 'The highest rarity there is.'}</div>
        <div class="detail-actions">
          <button class="btn-ghost" onclick="closeDetail()">Close</button>
        </div>
      </div>`;
  }
  detailVeil.classList.add('show');
}
function closeDetail() { detailVeil.classList.remove('show'); }
detailVeil.addEventListener('click', e => { if (e.target === detailVeil) closeDetail(); });

/* ---------- layout 3 ---------- */

const TREASURES = [
  { name:'Weathered Cache', price:240,  items:['nurturing_pouch','determination_sack','presence_chest','reflection_safe','adaptability_pouch'] },
  { name:'Gilded Hoard',    price:880,  items:['inspiration_chest','serenity_safe','vitality_vault','transformation_vault','freedom_sanctum'] },
  { name:'Deep Reliquary',  price:1520, items:['freedom_sanctum','serenity_vault','vitality_sanctum','presence_vault'] },
];
let picked = null, rolling = false;

document.getElementById('chests').innerHTML = TREASURES.map((t,i) => `
  <button class="chest" data-i="${i}">
    <img src="${rico(t.items[Math.floor(t.items.length/2)])}" alt="">
    <span class="cname">${t.name}</span>
    <span class="cprice"><img src="${ico('sun_fragment')}" width="13" height="13" alt="">${t.price}</span>
    <span class="ccount">${t.items.length} sealed</span>
  </button>`).join('');

document.querySelectorAll('.chest').forEach(el => el.onclick = () => {
  if (rolling) return;
  document.querySelectorAll('.chest').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  picked = TREASURES[el.dataset.i];
  document.getElementById('contents').innerHTML = picked.items.map(n =>
    `<div class="floater"><img src="${rico(n)}" alt=""><span class="fname">${pretty(n)}</span></div>`).join('');
  document.getElementById('buyBtn').style.display = 'block';
  document.getElementById('buyPrice').textContent = picked.price;
});

const wait = (ms) => new Promise(r => setTimeout(r, ms));

document.getElementById('buyBtn').onclick = async () => {
  if (rolling) return;
  rolling = true;
  document.getElementById('buyBtn').style.display = 'none';
  document.getElementById('rolling').style.display = 'block';

  const all = [...document.querySelectorAll('#contents .floater')];
  const winner = Math.floor(Math.random() * all.length);

  all.forEach(f => f.classList.add('shiver'));
  await wait(1400);

  // Go out one at a time rather than all at once — the drawn-out elimination
  // is the tension, so each one gets its own beat.
  const doomed = all.map((_, i) => i).filter(i => i !== winner);
  for (let i = doomed.length - 1; i > 0; i--) {           // shuffle the order
    const j = Math.floor(Math.random() * (i + 1));
    [doomed[i], doomed[j]] = [doomed[j], doomed[i]];
  }
  for (const i of doomed) {
    await wait(780);
    all[i].classList.remove('shiver');
    all[i].classList.add('out');
  }

  await wait(700);
  all[winner].classList.remove('shiver');
  all[winner].classList.add('won');
  await wait(1300);

  showPrize([{ img: rico(picked.items[winner]), title: pretty(picked.items[winner]), sub: 'dropped — now find its key' }]);
  all.forEach(f => f.classList.remove('won','out','shiver'));
  document.getElementById('rolling').style.display = 'none';
  document.getElementById('buyBtn').style.display = 'block';
  rolling = false;
};

/* ---------- reveal overlay ---------- */

const veil = document.getElementById('veil');
let queue = [], qi = 0;

function showPrize(items) { queue = items; qi = 0; veil.classList.add('show'); paintPrize(); }
function paintPrize() {
  const it = queue[qi];
  document.getElementById('veilBody').innerHTML = `
    <div class="prize">
      <img src="${it.img}" alt="">
      ${it.amount ? `<div class="amount">${it.amount}</div>` : ''}
      <div class="label">${it.title}</div>
      <div class="hint">${it.sub}</div>
    </div>`;
  document.getElementById('queueDots').innerHTML = queue.map((_,i) => `<i class="${i <= qi ? 'on' : ''}"></i>`).join('');
  document.getElementById('skipBtn').style.display = queue.length > 1 ? 'block' : 'none';
}
document.getElementById('acceptBtn').onclick = () => { qi++; if (qi >= queue.length) veil.classList.remove('show'); else paintPrize(); };
document.getElementById('skipBtn').onclick = () => veil.classList.remove('show');

document.getElementById('submitTask').onclick = () => {
  showPrize([
    { img: ico('fire_fragment'),  amount:'×13', title:'Fire Fragment',  sub:'willpower' },
    { img: ico('earth_fragment'), amount:'×8',  title:'Earth Fragment', sub:'discipline' },
    { img: ico('space_fragment'), amount:'×5',  title:'Space Fragment', sub:'awareness' },
  ]);
  document.getElementById('taskInput').value = '';
};

/* ---------- rail ---------- */

const deck = document.getElementById('deck');
document.querySelectorAll('.rail button').forEach(b =>
  b.onclick = () => deck.scrollTo({ top: innerHeight * +b.dataset.go, behavior:'smooth' }));
deck.addEventListener('scroll', () => {
  const i = Math.round(deck.scrollTop / innerHeight);
  document.querySelectorAll('.rail button').forEach((b,j) => b.classList.toggle('on', i === j));
});
</script>
